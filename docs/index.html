<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reviewer Quiz</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Reviewer Quiz"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f2f3f5;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--okt:#15803d;--badt:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#eee;--card:#262626;--ac:#60a5fa;--okt:#4ade80;--badt:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--fg:#eee;--card:#262626;--ac:#60a5fa;--okt:#4ade80;--badt:#f87171;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-size:var(--fs,16px);font-family:system-ui,sans-serif;padding:0 14px 24px;max-width:640px;margin:auto}
h2{margin:14px 0}button,textarea,input{font:inherit;color:inherit}
.b{display:block;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:12px;padding:13px;margin:8px 0}
.p{background:var(--ac);color:#fff;text-align:center}.sel{border-color:var(--ac)}.ok{border-color:var(--ok)}.bad{border-color:var(--bad)}
.row{display:flex;gap:8px}.row .b{text-align:center}textarea{width:100%;height:240px;background:var(--card);border:0;border-radius:12px;padding:10px}
input{width:100%;background:var(--card);border:0;border-radius:12px;padding:12px;margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.g button{padding:10px 0;border-radius:8px;border:2px solid transparent;background:var(--card)}
small{opacity:.75}.xw{color:var(--badt);border-left:3px solid var(--bad);padding-left:8px;margin-top:8px}.xr{color:var(--okt);border-left:3px solid var(--ok);padding-left:8px;margin-top:8px}.hd-ok{color:var(--okt)}.hd-bad{color:var(--badt)}.cg{display:block}.grid .cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .cg .b{margin:0}.bar{height:6px;background:var(--card);border-radius:4px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}.half{display:inline-block;width:calc(50% - 6px);margin-right:4px;text-align:center}.ex{background:var(--card);border-radius:12px;padding:12px;margin-top:8px}
</style></head><body><div id="app">Loading…</div><script src="config.js"></script><script>
const L='ABCD',$=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let snd=localStorage.getItem('rq_snd')!=='0',AC=null;
function beep(ok){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;(ok?[[660,0],[880,.12]]:[[190,0],[150,.14]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.22)})}catch(e){}}
function togSnd(){snd=!snd;localStorage.setItem('rq_snd',snd?'1':'0');if(snd)beep(true);render()}
let ui=Object.assign({th:'auto',bg:'#101820',ac:'',fs:16,grid:false,navTop:false,bar:true},(()=>{try{return JSON.parse(localStorage.getItem('rq_ui')||'{}')}catch(e){return {}}})());
const TH={dark:['#121212','#eeeeee','#262626'],amoled:['#000000','#eeeeee','#161616'],light:['#ffffff','#1a1a1a','#f2f3f5'],blue:['#0b1b33','#e8f0ff','#173a6b'],green:['#0d1f17','#e6f7ee','#1b4332'],purple:['#1a1030','#f0e9ff','#2f1c59']};
const lum=h=>{const n=parseInt(h.slice(1),16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255};
const mix=(h,t,a)=>{const n=parseInt(h.slice(1),16),m=parseInt(t.slice(1),16),c=s=>Math.round((n>>s&255)*(1-a)+(m>>s&255)*a);return'#'+[16,8,0].map(s=>c(s).toString(16).padStart(2,'0')).join('')};
function applyUI(){const r=document.documentElement.style;['--bg','--fg','--card','--ac','--okt','--badt','--fs'].forEach(k=>r.removeProperty(k));r.removeProperty('color-scheme');
let t=ui.th==='custom'?(()=>{const d=lum(ui.bg)<.5;return[ui.bg,d?'#eeeeee':'#111111',mix(ui.bg,d?'#ffffff':'#000000',.1)]})():TH[ui.th];
if(t){r.setProperty('--bg',t[0]);r.setProperty('--fg',t[1]);r.setProperty('--card',t[2]);const d=lum(t[0])<.5;r.setProperty('--okt',d?'#4ade80':'#15803d');r.setProperty('--badt',d?'#f87171':'#b91c1c');r.setProperty('color-scheme',d?'dark':'light')}
if(ui.ac)r.setProperty('--ac',ui.ac);r.setProperty('--fs',ui.fs+'px');document.body.classList.toggle('grid',!!ui.grid)}
function setUI(k,v){ui[k]=v;try{localStorage.setItem('rq_ui',JSON.stringify(ui))}catch(e){}applyUI();render()}
function setCustom(v){ui.bg=v;setUI('th','custom')}
const tu=(k,t)=>`<button class="b ${ui[k]?'sel':''}" onclick="setUI('${k}',${!ui[k]})">${ui[k]?'☑':'☐'} ${t}</button>`;
function cfg(){const sw=(k,n,c)=>`<button class="b half ${ui.th===k?'sel':''}" style="${c?'background:'+c[0]+';color:'+c[1]:''}" onclick="setUI('th','${k}')">${n}</button>`;
return `<h2>Settings</h2><b>Background</b><div>${sw('auto','Auto')}${Object.keys(TH).map(k=>sw(k,k[0].toUpperCase()+k.slice(1),TH[k])).join('')}</div>
<label class="b">Custom background<input type="color" value="${ui.bg}" onchange="setCustom(this.value)" style="height:44px;padding:2px;margin:6px 0 0"></label>
<label class="b">Accent color<input type="color" value="${ui.ac||'#2563eb'}" onchange="setUI('ac',this.value)" style="height:44px;padding:2px;margin:6px 0 0"></label><button class="b" onclick="setUI('ac','')"><small>Reset accent color</small></button>
<b>Layout</b><div>${[[14,'Small text'],[16,'Medium text'],[19,'Large text']].map(([n,t])=>`<button class="b half ${ui.fs===n?'sel':''}" style="width:calc(33% - 6px)" onclick="setUI('fs',${n})">${t}</button>`).join('')}</div>
${tu('grid','Show choices in 2 columns')}${tu('navTop','Prev / Next buttons at the top')}${tu('bar','Show progress bar')}
${user?`<p><small>Signed in as ${esc(user.email)}</small></p><button class="b" onclick="logout()">Sign out</button>`:''}<button class="b p" onclick="view='home';render()">Done</button>`}
let AU,AUTH,user=null,un=[],fs,DB,me,myName,isEd=true,sets=[],results={},names={},mine={},view='home',cur=null,i=0,grid=false,opt={c:false,q:false,r:false},cache={};
const V='10.14.1',U='https://www.gstatic.com/firebasejs/'+V+'/';
const err=e=>{alert('Couldn’t save: '+(e&&e.message||e)+'\nCheck your internet and the Firestore rules.')};
async function init(){if(typeof FIREBASE_CONFIG==='undefined'||String(FIREBASE_CONFIG.apiKey).startsWith('PASTE')){$.textContent='Setup needed: paste your Firebase config into config.js.';return}
try{const A=await import(U+'firebase-app.js');fs=await import(U+'firebase-firestore.js');const app=A.initializeApp(FIREBASE_CONFIG);AU=await import(U+'firebase-auth.js');AUTH=AU.getAuth(app);try{DB=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentSingleTabManager()})})}catch(e){DB=fs.getFirestore(app)}}catch(e){$.textContent='Couldn’t load Firebase. Check your internet.';return}
AU.onAuthStateChanged(AUTH,u=>{user=u;un.forEach(f=>f());un=[];if(!u){sets=[];results={};mine={};view='login';render();return}
me=u.uid;myName=localStorage.getItem('rq_name_'+me);if(!myName){myName=(prompt('Your name?')||u.email.split('@')[0]).slice(0,30);localStorage.setItem('rq_name_'+me,myName)}
if(view==='login')view='home';listen();render()})}
const perm=e=>{if(e&&e.code==='permission-denied'){$.innerHTML='<h2>Not allowed</h2><p>This account isn’t on the allowed list.</p><button class="b" onclick="logout()">Sign out</button>';return}err(e)};
function listen(){un.push(fs.onSnapshot(fs.collection(DB,'sets'),s=>{sets=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));if(cur)cur=sets.find(x=>x.id===cur.id)||cur;draw()},perm));
un.push(fs.onSnapshot(fs.collection(DB,'results'),s=>{results={};names={};s.docs.forEach(d=>{const x=d.data();results[d.id]=x.p||{};names[d.id]={name:x.name}});mine=results[me]||{};draw()},perm))}
function login(){return `<h2>Reviewer Quiz</h2><p><small>Sign in with the email and password you were given.</small></p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b p" onclick="doLogin()">Sign in</button><p id="le" style="color:var(--badt)"></p>`}
async function doLogin(){const e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value;try{await AU.signInWithEmailAndPassword(AUTH,e,p)}catch(x){document.getElementById('le').textContent='Sign-in failed. Check your email and password.'}}
function logout(){view='login';AU.signOut(AUTH)}
async function putSet(title,qs,ts){const data=JSON.stringify(qs);if(data.length>900000){alert('Too big for one set. Split it.');return false}
try{await fs.setDoc(fs.doc(DB,'sets',String(ts||Date.now())),{title,ts:ts||Date.now(),n:qs.length,data});return true}catch(e){err(e);return false}}
async function loadStarter(){let t=Date.now();for(const f of ['terms_all.json','set8_terms.json']){try{const j=await (await fetch(f)).json();await putSet(j.title,j.questions,t++)}catch(e){err(e)}}}
addEventListener('online',()=>draw());addEventListener('offline',()=>draw());
function draw(){if(view!=='imp'&&view!=='login')render()}
function render(){$.innerHTML=({home,imp,setup,quiz,res,login,cfg})[view]()}
const Q=s=>cache[s.id+s.ts]||(cache[s.id+s.ts]=JSON.parse(s.data));
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function shuf(a,r){for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function sess(s,p){const qs=Q(s),r=rng(p.s);let o=[...qs.keys()];if(p.o.includes('q'))shuf(o,r);
const perm=qs.map(q=>{let ix=[0,1,2,3].filter(j=>q.c[j]);if(p.o.includes('c'))shuf(ix,r);return ix});return{qs,o,perm}}
async function saveP(){try{await fs.setDoc(fs.doc(DB,'results',me),{name:myName,p:mine})}catch(e){err(e)}}
function parse(t){const qs=[];let q=null,mode='q',last=0;
for(const raw of t.replace(/\r/g,'').split('\n')){const l=raw.trim();if(!l||/^Page \d+$/i.test(l))continue;
let m=l.match(/^(\d+)\.\s+(.*)/);if(m){q={q:m[2],c:['','','',''],a:null,e:''};qs.push(q);mode='q';continue}
if(!q)continue;if(/^Answer:/i.test(l)){const a=l.match(/Answer:\s*([A-D])/i);q.a=a?a[1]:null;mode='e';continue}
if(mode!=='e'&&/^[A-D]\.\s/.test(l)){for(const p of l.split(/\s+(?=[A-D]\.\s)/)){const c=p.match(/^([A-D])\.\s*(.*)/);if(c){last=L.indexOf(c[1]);q.c[last]=c[2];mode='c'}else q.c[last]+=' '+p}continue}
if(mode==='e')q.e+=(q.e?' ':'')+l;else if(mode==='c')q.c[last]+=' '+l;else q.q+=' '+l}
return qs.filter(x=>x.c.filter(Boolean).length>=2)}
async function doImport(){const t=document.getElementById('t').value.trim();let title=document.getElementById('n').value.trim(),qs;
try{const j=JSON.parse(t);qs=Array.isArray(j)?j:j.questions;title=title||j.title}catch(e){qs=parse(t)}
if(!qs||!qs.length){alert('No questions found.');return}
qs=qs.map(x=>({q:x.q,c:Array.from(x.c||[]).map(s=>s||''),a:x.a??null,e:x.e??'',x:x.x||null}));if(await putSet(title||'Set',qs)){view='home';render()}}
function home(){return `<h2>Reviewer Quiz <small>v9</small></h2><button class="b" onclick="togSnd()">${snd?'🔊 Sound on':'🔇 Sound off'}</button><button class="b" onclick="view='cfg';render()">⚙ Settings (background and layout)</button>`+(navigator.onLine?'':'<p><small>Offline: your answers are saved on this phone and will sync when you’re back online.</small></p>')+(isEd?`<button class="b p" onclick="view='imp';render()">+ Add questions</button>`:'')+
(sets.length?sets.map(s=>{const lines=Object.keys(results).filter(u=>results[u][s.id]).map(u=>{const p=results[u][s.id];return `${u===me?'You':esc(names[u]?.name||'Someone')}: ${p.ok}/${p.g} correct · ${p.n}/${s.n} answered`}).join('<br>');
return `<button class="b" onclick="openSet('${s.id}')"><b>${esc(s.title)}</b> <small>(${s.n} questions)</small>${lines?'<br><small>'+lines+'</small>':''}</button>`}).join(''):'<p><small>No quizzes yet.</small></p><button class="b" onclick="loadStarter()">Load the 2 starter sets</button>')}
function imp(){return `<h2>Add questions</h2><input id="n" placeholder="Set name (optional)"><textarea id="t" placeholder="Paste question text or JSON"></textarea><button class="b p" onclick="doImport()">Save to server</button><button class="b" onclick="view='home';render()">Cancel</button>`}
function openSet(id){cur=sets.find(s=>s.id===id);view='setup';render()}
const tog=(k,t)=>`<button class="b ${opt[k]?'sel':''}" onclick="opt.${k}=!opt.${k};render()">${opt[k]?'☑':'☐'} ${t}</button>`;
function setup(){const p=mine[cur.id];return `<h2>${esc(cur.title)}</h2>`+tog('c','Shuffle A/B/C/D positions')+tog('q','Randomize question order and numbers')+tog('r','Retry mode<br><small>After a wrong answer it explains only the answer you picked (why it’s wrong) and lets you try again. Score counts your first try.</small>')+
(p?`<button class="b p" onclick="resume()">Resume (${p.n}/${cur.n})</button>`:'')+`<button class="b ${p?'':'p'}" onclick="start()">Start new</button>`+
(isEd?`<button class="b" onclick="del()"><small>Delete this set</small></button>`:'')+`<button class="b" onclick="view='home';render()">Back</button>`}
async function del(){if(!confirm('Delete this set for everyone?'))return;try{await fs.deleteDoc(fs.doc(DB,'sets',cur.id));view='home';render()}catch(e){err(e)}}
function start(){if(mine[cur.id]&&mine[cur.id].n&&!confirm('Start new? This clears your answers for this set.'))return;
mine[cur.id]={s:Math.floor(Math.random()*2147483647),o:(opt.c?'c':'')+(opt.q?'q':'')+(opt.r?'r':''),a:{},n:0,ok:0,g:0};saveP();i=0;grid=false;view='quiz';render()}
function resume(){const p=mine[cur.id],S=sess(cur,p);const k=S.o.findIndex(K=>!p.a[K]);i=k<0?0:k;grid=false;view='quiz';render()}
function pick(l){const p=mine[cur.id],S=sess(cur,p),K=S.o[i],q=S.qs[K],ca=q.a?L[S.perm[K].indexOf(L.indexOf(q.a))]:null;
if(ca&&p.o.includes('r')){p.t=p.t||{};const t=p.t[K]||'';if(t.includes(ca)||t.includes(l))return;if(!p.a[K]){p.a[K]=l;p.n++;p.g++;if(l===ca)p.ok++}p.t[K]=t+l;beep(l===ca);saveP();render();return}
if(p.a[K]&&ca)return;if(!p.a[K]){p.n++;if(ca){p.g++;if(l===ca)p.ok++;beep(l===ca)}}p.a[K]=l;saveP();render()}
function go(n){i=n;grid=false;render()}
function quiz(){const p=mine[cur.id],S=sess(cur,p),K=S.o[i],q=S.qs[K],a=p.a[K],pm=S.perm[K],ca=q.a?L[pm.indexOf(L.indexOf(q.a))]:null,rt=!!ca&&p.o.includes('r'),t=(p.t&&p.t[K])||'',solved=rt&&t.includes(ca),nav=`<div class="row" style="margin-top:12px"><button class="b" ${i?'':'disabled'} onclick="go(i-1)">Prev</button><button class="b p" ${i<S.o.length-1?'':'disabled'} onclick="go(i+1)">Next</button></div>`;
let h=`<div class="row"><button class="b" onclick="view='setup';render()">←</button><button class="b" onclick="grid=!grid;render()">${i+1} / ${S.o.length}</button><button class="b" onclick="view='res';render()">Finish</button></div>`+(ui.bar?`<div class="bar"><i style="width:${Math.round(100*p.n/S.o.length)}%"></i></div>`:'')+(ui.navTop?nav:'');
if(grid)return h+`<div class="g">${S.o.map((k,n)=>`<button onclick="go(${n})" style="${p.a[k]?'border-color:var(--ac)':''}">${n+1}</button>`).join('')}</div>`;
h+=`<h3>${i+1}. ${esc(q.q)}</h3>`;
h+='<div class="cg">';pm.forEach((src,j)=>{const l=L[j];let cl='';if(rt){if(t.includes(l))cl=l===ca?'ok':'bad'}else if(a){if(ca)cl=l===ca?'ok':(l===a?'bad':'');else if(l===a)cl='sel'}h+=`<button class="b ${cl}" onclick="pick('${l}')"><b>${l}.</b> ${esc(q.c[src])}</button>`});h+='</div>';
if(rt&&t){const X=q.x||{},xc=X[L[pm[L.indexOf(ca)]]];let ex=solved?'<b class="hd-ok">Correct'+(t.length>1?' (after '+(t.length-1)+' wrong '+(t.length>2?'tries':'try')+')':'')+'</b>':'<b class="hd-bad">Not quite. Try again.</b>';
for(const w of t){if(w===ca)continue;const xw=X[L[pm[L.indexOf(w)]]];if(xw)ex+='<div class="xw"><b>You chose '+w+':</b> '+esc(xw)+'</div>'}
if(solved){if(xc)ex+='<div class="xr"><b>Why '+ca+' is right:</b> '+esc(xc)+'</div>';if(q.e)ex+='<br><small>'+esc(q.e)+'</small>'}h+='<div class="ex">'+ex+'</div>'}
else if(a&&ca){const X=q.x||{},xa=X[L[pm[L.indexOf(a)]]],xc=X[L[pm[L.indexOf(ca)]]],ok=a===ca;let ex='<b class="'+(ok?'hd-ok':'hd-bad')+'">'+(ok?'Correct':'Wrong. Correct answer: '+ca)+'</b>';
if(!ok&&xa)ex+='<div class="xw"><b>Why your answer ('+a+') is wrong:</b> '+esc(xa)+'</div>';
if(xc)ex+='<div class="xr">'+(ok?'':'<b>Why '+ca+' is right:</b> ')+esc(xc)+'</div>';
if(q.e)ex+='<br><small>'+esc(q.e)+'</small>';h+='<div class="ex">'+ex+'</div>'}
if(a&&!ca)h+=`<div class="ex"><small>No answer key for this item.</small></div>`;
return h+(ui.navTop?'':nav)}
function res(){const p=mine[cur.id],S=sess(cur,p),wrong=[];S.o.forEach((K,n)=>{const q=S.qs[K],a=p.a[K];if(a&&q.a&&a!==L[S.perm[K].indexOf(L.indexOf(q.a))])wrong.push(n)});
return `<h2>Results</h2><p><b>${p.ok} / ${p.g}</b> correct<br><small>${S.o.length-p.n} unanswered</small></p>`+(wrong.length?`<p>Missed:</p><div class="g">${wrong.map(n=>`<button onclick="go(${n});view='quiz';render()">${n+1}</button>`).join('')}</div>`:'')+
`<button class="b" onclick="view='quiz';render()">Back to quiz</button><button class="b" onclick="view='home';render()">Home</button>`}
applyUI();init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
